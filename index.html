    <!-- Google tag (gtag.js) -- the gtag.js library itself is loaded on

          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-1BMZVFPMCC';
          document.head.appendChild(s);
        }
        if ('requestIdleCallback' in window) {
          requestIdleCallback(loadGtag, { timeout: 3500 });
        } else {
          window.addEventListener('load', function(){ setTimeout(loadGtag, 1); });
        }
      })();
